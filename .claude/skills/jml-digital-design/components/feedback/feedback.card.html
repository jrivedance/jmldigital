<!DOCTYPE html><html><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.grid{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.cap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle);margin:0 0 8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.JMLDigitalDesignSystem_7e0556;
function Icon({name,size=16,color="currentColor"}){const r=React.useRef(null);React.useEffect(()=>{if(window.lucide&&r.current){r.current.innerHTML="";const el=document.createElement("i");el.setAttribute("data-lucide",name);r.current.appendChild(el);window.lucide.createIcons({attrs:{width:size,height:size,stroke:color}});}},[name,size]);return <span ref={r} style={{display:"inline-flex",width:size,height:size}} />;}

const {Alert} = DS;
function Card(){return (<div style={{display:"flex",flexDirection:"column",gap:12}}>
<Alert tone="danger" icon={<Icon name="alert-circle" color="#b91c1c" />}>That email or password isn&rsquo;t right. Try again.</Alert>
<Alert tone="success" icon={<Icon name="check-circle-2" color="#16a34a" />} title="Thanks — we&rsquo;ve got it.">We&rsquo;ll be in touch shortly with availability and pricing.</Alert>
<Alert tone="warning" icon={<Icon name="alert-triangle" color="#b45309" />}>This order is still awaiting payment.</Alert>
<Alert tone="info" icon={<Icon name="bell-ring" color="#175282" />}>Two follow-ups are due today.</Alert>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
