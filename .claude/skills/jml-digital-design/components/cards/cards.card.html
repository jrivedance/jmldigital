<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cards</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.grid{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.cap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle);margin:0 0 8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.JMLDigitalDesignSystem_7e0556;
function Icon({name,size=16,color="currentColor"}){const r=React.useRef(null);React.useEffect(()=>{if(window.lucide&&r.current){r.current.innerHTML="";const el=document.createElement("i");el.setAttribute("data-lucide",name);r.current.appendChild(el);window.lucide.createIcons({attrs:{width:size,height:size,stroke:color}});}},[name,size]);return <span ref={r} style={{display:"inline-flex",width:size,height:size}} />;}

const {ServiceCard,PackageCard,TestimonialCard,PriceRow,Panel} = DS;
function Card(){return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,alignItems:"start"}}>
<ServiceCard title="Drone / Aerial" description="Breathtaking aerial views, captured by licensed pilots." statValue="68%" statLabel=" increase in engagement" coverImage="../../assets/images/drone/cover.png" />
<PackageCard name="Highlight" price={295} banner="../../assets/images/Highlight.jpg" features={["2 Virtual Twilights","40 MLS Photos","8 Drone Photos","2D Floor Plan","Marketing Kit"]} />
<div style={{display:"flex",flexDirection:"column",gap:16}}>
<TestimonialCard name="Warren Freeman" quote="High quality work! Jordan always makes sure my listing photos and videos turn out great! Highly recommend!" />
<Panel padding="20px"><div style={{fontFamily:"var(--font-display)",fontSize:16,marginBottom:6}}>Photography</div>
<ul style={{margin:0,padding:0}}>
<PriceRow name="Aerial Photos" detail="6-8 photos" price={145} />
<PriceRow name="3D Floor Plan" price={95} />
<PriceRow name="Virtual Staging" price={25} priceSuffix="/photo" />
</ul></Panel>
</div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
