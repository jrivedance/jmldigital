<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Order, payment and follow-up states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-top:6px;font-family:var(--font-mono)}</style></head><body><div class="row">
<div style="flex:1;border-radius:var(--radius-lg);border:1px solid var(--success-border);background:var(--success-bg);padding:14px"><div style="font-size:13px;font-weight:600;color:var(--success-fg)">Delivered</div><div class="lbl" style="color:var(--success-fg);opacity:.6">success</div></div><div style="flex:1;border-radius:var(--radius-lg);border:1px solid var(--warning-border);background:var(--warning-bg);padding:14px"><div style="font-size:13px;font-weight:600;color:var(--warning-fg)">Unpaid</div><div class="lbl" style="color:var(--warning-fg);opacity:.6">warning</div></div><div style="flex:1;border-radius:var(--radius-lg);border:1px solid var(--danger-border);background:var(--danger-bg);padding:14px"><div style="font-size:13px;font-weight:600;color:var(--danger-fg)">3d overdue</div><div class="lbl" style="color:var(--danger-fg);opacity:.6">danger</div></div><div style="flex:1;border-radius:var(--radius-lg);border:1px solid var(--info-border);background:var(--info-bg);padding:14px"><div style="font-size:13px;font-weight:600;color:var(--info-fg)">Due today</div><div class="lbl" style="color:var(--info-fg);opacity:.6">info</div></div>
</div><div style="margin-top:14px;font-size:12px;color:var(--text-subtle)">Amber stars (<span style="color:var(--star)">&#9733;&#9733;&#9733;&#9733;&#9733;</span>) are the only other non-blue colour in the system.</div></body></html>
