<!DOCTYPE html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-top:6px;font-family:var(--font-mono)}</style></head><body><div class="row" style="align-items:center;gap:20px">
<button style="border:none;border-radius:9999px;background:var(--brand-600);color:#fff;padding:12px 24px;font-family:var(--font-body);font-weight:600;font-size:14px;box-shadow:var(--shadow-glow-brand);transition:transform .3s ease-out" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='none'">Hover me</button>
<div style="font-size:12px;color:var(--text-subtle);line-height:1.7">
hover <code style="font-family:var(--font-mono);color:var(--brand-700)">scale(1.03)</code> · press <code style="font-family:var(--font-mono);color:var(--brand-700)">scale(0.98)</code> · 300ms<br>
panel hover 500ms · scroll reveal 600ms <code style="font-family:var(--font-mono);color:var(--brand-700)">cubic-bezier(.16,1,.3,1)</code> from y+28px<br>
hero crossfade 1000ms · carousel dwell 5.5s · all motion opt-out under prefers-reduced-motion
</div></div></body></html>
