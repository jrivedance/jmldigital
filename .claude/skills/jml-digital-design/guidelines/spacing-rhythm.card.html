<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rhythm</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-top:6px;font-family:var(--font-mono)}</style></head><body><div style="border:1px dashed var(--border-default);border-radius:var(--radius-xl);padding:20px;text-align:center">

</div><div class="lbl">Sections: 112px vertical padding (80px tight) · content max-width 1152px · 24px gutter</div></body></html>
