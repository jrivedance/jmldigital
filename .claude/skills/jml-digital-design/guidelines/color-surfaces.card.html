<!DOCTYPE html><html><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);margin-top:6px;font-family:var(--font-mono)}</style></head><body><div class="row">
<div style="flex:1;height:96px;background:var(--surface);border:1px solid var(--border-hairline);border-radius:var(--radius-xl);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-subtle)">#ffffff</div>
<div style="flex:1;height:96px;background:var(--surface-raised);border-radius:var(--radius-xl);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-subtle)">raised #f7f9fc</div>
<div style="flex:1.4;height:96px;background:var(--brand-50);border-radius:var(--radius-xl);padding:10px;display:flex;align-items:flex-end"><div style="width:100%;height:56px;border-radius:var(--radius-xl);border:1px solid var(--border-hairline);background:var(--surface-glass);backdrop-filter:blur(24px);box-shadow:var(--shadow-glass);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text-subtle)">glass · white 70% + 24px blur</div></div>
</div></body></html>
